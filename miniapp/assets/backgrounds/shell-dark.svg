<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <title>Shell Radiance · dark</title>
  <desc>Warm shell tones flow diagonally through a soft satin highlight. Original abstract background for TRON Mineral.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2A2A2A"/>
      <stop offset=".23" stop-color="#4D4A44"/>
      <stop offset=".49" stop-color="#6C6459"/>
      <stop offset=".72" stop-color="#4D4A44"/>
      <stop offset="1" stop-color="#2A2A2A"/>
    </linearGradient>
    <linearGradient id="satin" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#FEF7EE" stop-opacity="0"/><stop offset=".38" stop-color="#FEF7EE" stop-opacity="0"/><stop offset=".53" stop-color="#FEF7EE" stop-opacity=".035"/><stop offset=".68" stop-color="#FEF7EE" stop-opacity="0"/><stop offset="1" stop-color="#FEF7EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fade" cx=".5" cy=".5" r=".8">
      <stop stop-color="#2A2A2A" stop-opacity=".53"/><stop offset="1" stop-color="#2A2A2A" stop-opacity=".2"/>
    </radialGradient></defs>
  <rect width="1600" height="1200" fill="url(#shell)"/><rect width="1600" height="1200" fill="url(#satin)"/><rect width="1600" height="1200" fill="url(#fade)"/>
</svg>
