<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <title>Nickel Diffusion · light</title>
  <desc>Broad softly curved mineral bands in neutral nickel tones. Original abstract background for TRON Mineral.</desc>
  <defs>
    <linearGradient id="nickel" x1=".08" y1="0" x2=".88" y2="1">
      <stop stop-color="#DDD6CD"/><stop offset=".45" stop-color="#F4F4F4"/><stop offset="1" stop-color="#DDD6CD"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#DDD6CD" stop-opacity=".23"/><stop offset=".6" stop-color="#787776" stop-opacity=".12"/><stop offset="1" stop-color="#DDD6CD" stop-opacity="0"/>
